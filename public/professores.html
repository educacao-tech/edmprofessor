<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Professores</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --border-color: #dfe6e9;
            --success-color: #27ae60;
            --danger-color: #d63031;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1 {
            color: var(--primary-hover);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .filters {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            padding: 20px;
            background-color: #f1f3f5;
            border-radius: 8px;
        }

        .filters label {
            font-weight: 600;
            font-size: 0.9em;
        }

        .filters input[type="text"],
        .filters select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filters input[type="text"]:focus,
        .filters select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            transition: box-shadow 0.2s ease;
        }

        td:hover {
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.06);
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        th {
            background-color: var(--primary-hover); /* Um tom um pouco mais escuro para diferenciar */
            color: white;
            font-weight: 600; /* Aumentado para mais destaque */
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        th:hover {
            background-color: var(--primary-hover);
        }
        
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: rgba(0, 123, 255, 0.08);
            transition: background-color 0.15s ease;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            display: inline-block;
        }

        .badge-presente {
            background-color: var(--success-color);
        }

        .badge-ausente {
            background-color: var(--danger-color);
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #f1f3f5;
            border-color: var(--primary-color);
        }

        .pagination button.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            body { margin: 10px 5px; }
            .container { padding: 15px 10px; border-radius: 8px; }
            .filters { padding: 12px; flex-direction: column; align-items: stretch; gap: 10px; }
            .filters input[type="text"], .filters select { width: 100%; height: 40px; font-size: 16px; box-sizing: border-box; }
            .table-responsive { max-height: 480px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            table { min-width: 600px; }
            th, td { padding: 8px 10px; font-size: 0.85rem; }
        }
    </style>
</head>

        window.setSort = (key) => {
            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = 'asc';
            }
            renderTable();
        };

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / rowsPerPage);
            paginationDiv.innerHTML = '';

            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Anterior';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderTable(); };
            paginationDiv.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                if (i === currentPage) btn.classList.add('active');
                btn.onclick = () => { currentPage = i; renderTable(); };
                paginationDiv.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Próximo';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderTable(); };
            paginationDiv.appendChild(nextBtn);
        }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedSchool = schoolFilter.value;
            const selectedDisciplina = disciplineFilter.value;

            const filteredProfessores = jsonData.professores.filter(professor => {
                const matchesSearch = (
                    professor.nome.toLowerCase().includes(searchTerm) ||
                    professor.escola.toLowerCase().includes(searchTerm) ||
                    professor.disciplina.toLowerCase().includes(searchTerm) ||
                    professor.ano.toLowerCase().includes(searchTerm) ||
                    professor.turma.toLowerCase().includes(searchTerm) ||
                    professor.turno.toLowerCase().includes(searchTerm)
                );

                const matchesSchool = selectedSchool === '' || professor.escola === selectedSchool;
                const matchesDiscipline = selectedDisciplina === '' || professor.disciplina === selectedDisciplina;

                return matchesSearch && matchesSchool && matchesDiscipline;
            });

            // Lógica de Ordenação
            filteredProfessores.sort((a, b) => {
                let valA = a[sortConfig.key];
                let valB = b[sortConfig.key];

                if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            // Lógica de Paginação: fatiar os resultados
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filteredProfessores.slice(start, end);

            if (paginatedItems.length > 0) {
                const headers = [
                    { label: 'Nome', key: 'nome' },
                    { label: 'Escola', key: 'escola' },
                    { label: 'Disciplina', key: 'disciplina' },

                    { label: 'Turma', key: 'turma' },
                    { label: 'Turno', key: 'turno' },
                    { label: 'Telefone', key: 'telefone' },
                    { label: 'Presença (06/05/2026)', key: 'presenca_2026_05_06' }
                ];

                let tableHTML = '<table>';
                tableHTML += '<thead><tr>';
                headers.forEach(h => {
                    const icon = sortConfig.key === h.key ? (sortConfig.direction === 'asc' ? ' ▴' : ' ▾') : '';
                    tableHTML += `<th onclick="setSort('${h.key}')">${h.label}${icon}</th>`;
                });
                tableHTML += '</tr></thead>';
                tableHTML += '<tbody>';

                paginatedItems.forEach(professor => {
                    const presencaClass = professor.presenca_2026_05_06 ? 'badge-presente' : 'badge-ausente';
                    const presencaText = professor.presenca_2026_05_06 ? 'Presente' : 'Ausente';

                    tableHTML += '<tr>';
                    tableHTML += `<td><strong>${professor.nome}</strong></td>`;
                    tableHTML += `<td>${professor.escola}</td>`;
                    tableHTML += `<td>${professor.disciplina}</td>`;
                    tableHTML += `<td>${professor.ano}</td>`;
                    tableHTML += `<td>${professor.turma}</td>`;
                    tableHTML += `<td>${professor.turno}</td>`;
                    tableHTML += `<td>${professor.telefone}</td>`;
                    tableHTML += `<td><span class="badge ${presencaClass}">${presencaText}</span></td>`;
                    tableHTML += '</tr>';
                });

                tableHTML += '</tbody></table>';
                professoresListDiv.innerHTML = tableHTML;
            } else {
                professoresListDiv.innerHTML = '<p>Nenhum professor encontrado com os critérios de busca e filtro.</p>';
            }

            renderPagination(filteredProfessores.length);
        }

        const resetAndRender = () => {
            currentPage = 1;
            renderTable();
        };

        // Adicionar event listeners para os filtros
        searchInput.addEventListener('input', resetAndRender);
        schoolFilter.addEventListener('change', resetAndRender);
        disciplineFilter.addEventListener('change', resetAndRender);

        // Renderizar a tabela inicialmente
        renderTable();
    </script>
</body>
</html>
