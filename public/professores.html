<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando • Lista de Professores EDM</title>
    <meta http-equiv="refresh" content="0; url=index.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --primary-color: #2563eb;
            --border-color: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #3b82f6;
            --border-color: #334155;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .redirect-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 36px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }
        .spinner {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 14px;
        }
        h1 { font-size: 1.2rem; margin: 0 0 8px 0; }
        p { font-size: 0.9rem; color: var(--text-secondary); margin: 0 0 22px 0; line-height: 1.5; }
        a.btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-color);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            padding: 11px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            const target = 'index.html' + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
        <h1>Redirecionando para o Painel EDM</h1>
        <p>Esta página foi unificada ao novo Painel de Professores. Caso não seja redirecionado automaticamente, clique abaixo.</p>
        <a href="index.html" class="btn"><i class="fas fa-arrow-right"></i> Abrir Painel de Professores</a>
    </div>
</body>
</html>
