<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada • EDM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --secondary-bg: #f1f5f9;
            --secondary-hover: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --secondary-bg: #334155;
            --secondary-hover: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.25s, color 0.25s;
        }
        .card-404 {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        }
        .badge-edm {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary-color);
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 18px;
        }
        .code-404 {
            font-size: 4.2rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;
            transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-color);
        }
        .btn-secondary:hover { background: var(--secondary-hover); }
    </style>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <main class="card-404">
        <div class="badge-edm"><i class="fas fa-graduation-cap"></i> EDUCAÇÃO DIGITAL E MIDIÁTICA</div>
        <div class="code-404">404</div>
        <h1>Página não encontrada</h1>
        <p>O endereço acessado não existe ou foi movido. Utilize um dos atalhos abaixo para retornar ao sistema EDM.</p>
        <div class="actions">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-users"></i> Ir para o Painel de Professores
            </a>
            <a href="avaliacao.html" class="btn btn-secondary">
                <i class="fas fa-clipboard-check"></i> Acessar Avaliação Anual 2026
            </a>
        </div>
    </main>
</body>
</html>
