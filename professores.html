        }

            color: white;

        tr:nth-child(even) {

        }

            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);

        .filters {

            align-items: center;
        }
        .filters label {
            font-weight: bold;
            margin-right: 5px;
        }
        .filters input[type="text"],

            option.textContent = school;
            schoolFilter.appendChild(option);
        });

        allDisciplines.forEach(discipline => {
            const option = document.createElement('option');
            option.value = discipline;
            option.textContent = discipline;
            disciplineFilter.appendChild(option);
        });

            const searchTerm = searchInput.value.toLowerCase();
            const selectedSchool = schoolFilter.value;
            const selectedDisciplina = disciplineFilter.value;

            const filteredProfessores = jsonData.professores.filter(professor => {
                const matchesSearch = (
                    professor.nome.toLowerCase().includes(searchTerm) ||
                    professor.escola.toLowerCase().includes(searchTerm) ||
                    professor.disciplina.toLowerCase().includes(searchTerm) ||
                    professor.ano.toLowerCase().includes(searchTerm) ||
                    professor.turma.toLowerCase().includes(searchTerm) ||
                    professor.turno.toLowerCase().includes(searchTerm)
                );

                const matchesSchool = selectedSchool === '' || professor.escola === selectedSchool;
                const matchesDiscipline = selectedDisciplina === '' || professor.disciplina === selectedDisciplina;

                return matchesSearch && matchesSchool && matchesDiscipline;
            });

            if (filteredProfessores.length > 0) {

                tableHTML += '<thead><tr><th>Nome</th><th>Escola</th><th>Disciplina</th><th>Ano</th><th>Turma</th><th>Turno</th><th>Telefone</th><th>Presença (06/05/2026)</th></tr></thead>';

                    tableHTML += `<td>${professor.escola}</td>`;
                    tableHTML += `<td>${professor.disciplina}</td>`;
                    tableHTML += `<td>${professor.ano}</td>`;
                    tableHTML += `<td>${professor.turma}</td>`;
                    tableHTML += `<td>${professor.turno}</td>`;
                    tableHTML += `<td>${professor.telefone}</td>`;
                    tableHTML += `<td>${professor.presenca_2026_05_06 ? 'Presente' : 'Ausente'}</td>`;
                    tableHTML += '</tr>';
                });

                tableHTML += '</tbody></table>';
                professoresListDiv.innerHTML = tableHTML;
            } else {
                professoresListDiv.innerHTML = '<p>Nenhum professor encontrado com os critérios de busca e filtro.</p>';
            }
        }

        schoolFilter.addEventListener('change', renderTable);
        disciplineFilter.addEventListener('change', renderTable);
