<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Professores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --border-color: #dfe6e9;
            --success-color: #27ae60;
            --danger-color: #d63031;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        html[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #3791f9;
            --primary-hover: #56a2f9;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        
        h1 {
            color: var(--text-color);
            text-align: left;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 1.875rem;
            letter-spacing: -0.025em;
        }

        .header-section {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            min-height: 500px; /* Garante que o container não encolha muito */
            position: relative;
        }

        .theme-switch-wrapper {
            position: absolute;
            top: 30px;
            right: 30px;
        }

        #theme-toggle {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
        }

        #theme-toggle:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background-color: #f9fafb; /* Usar uma cor fixa para o fundo do filtro para contraste */
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        html[data-theme="dark"] .filters {
            background-color: #2a2a2a; /* Cor para o filtro no modo escuro */
        }

        .filters label {
            font-weight: 600;
            font-size: 0.9em;
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .filters > div {
            flex: 1;
            min-width: 220px;
        }

        .filters input[type="text"],
        .filters select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filters input[type="text"]:focus,
        .filters select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        #results-count {
            font-weight: 600;
            color: var(--primary-color);
        }

        .table-responsive {
            max-height: 650px; /* Altura máxima para a tabela com scroll */
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        th:hover {
            background-color: var(--border-color);
        }

        tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.02);
        }

        table tbody tr:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .badge-presente {
            background-color: var(--success-color);
        }

        .badge-ausente {
            background-color: var(--danger-color);
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #f1f3f5;
            border-color: var(--primary-color);
        }

        .pagination button.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="theme-switch-wrapper">
            <button id="theme-toggle" title="Alternar Modo Escuro/Claro"><i class="fas fa-moon"></i></button>
        </div>
        <div class="header-section">
            <h1>Lista de Professores</h1>
            <p style="color: var(--text-secondary); margin: 0;">Sistema de Gestão e Monitoramento de Frequência Acadêmica</p>
        </div>
        <div class="filters">
            <div>
                <label for="search-input">Pesquisa Geral</label>
                <input type="text" id="search-input" placeholder="Nome, escola, disciplina...">
            </div>
            <div>
                <label for="school-filter">Escola</label>
                <select id="school-filter">
                    <option value="">Todas as Escolas</option>
                </select>
            </div>
            <div>
                <label for="discipline-filter">Disciplina</label>
                <select id="discipline-filter">
                    <option value="">Todas as Disciplinas</option>
                </select>
            </div>
        </div>
        <div class="results-info">
            <span id="results-count">Carregando dados...</span>
            <span>Ano Letivo: 2026</span>
        </div>
        <div id="professores-list" class="table-responsive">
            <!-- A lista de professores será carregada aqui pelo JavaScript -->
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        // Lógica de Dark Mode
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            updateThemeIcon('dark');
        } else {
            updateThemeIcon('light'); // Garante que o ícone inicial esteja correto para o tema claro
        }

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        let jsonData = { professores: [] };
        let presencaKey = ''; // Chave dinâmica para a presença (ex: presenca_2026_05_06)
        let presencaDateFormatted = ''; // Data formatada para o cabeçalho da tabela

        function extractPresenceInfo(professores) {
            if (professores.length > 0) {
                const firstProfessor = professores[0];
                for (const key in firstProfessor) {
                    if (key.startsWith('presenca_')) {
                        presencaKey = key;
                        const datePart = key.replace('presenca_', ''); // e.g., "2026_05_06"
                        const [year, month, day] = datePart.split('_');
                        presencaDateFormatted = `${day}/${month}/${year}`;
                        break;
                    }
                }
            }
        }

        async function loadData() {
            professoresListDiv.innerHTML = '<p class="loading-message"><i class="fas fa-spinner fa-spin"></i> Carregando dados dos professores...</p>';
            try {
                const response = await fetch('backup_professores_2026-05-18.json');
                jsonData = await response.json();
                extractPresenceInfo(jsonData.professores); // Extrai a chave de presença e formata a data
                initFilters();
                renderTable();
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                professoresListDiv.innerHTML = '<p>Erro ao carregar a lista de professores.</p>';
            }
        }

        const professoresListDiv = document.getElementById('professores-list');
        const searchInput = document.getElementById('search-input');
        const schoolFilter = document.getElementById('school-filter');
        const disciplineFilter = document.getElementById('discipline-filter');
        const paginationDiv = document.getElementById('pagination');
        const resultsCountSpan = document.getElementById('results-count');

        // Configuração de ordenação inicial
        let sortConfig = {
            key: 'nome',
            direction: 'asc'
        };

        // Configuração de paginação
        let currentPage = 1;
        const rowsPerPage = 10;

        function initFilters() {
            const allSchools = [...new Set(jsonData.professores.map(p => p.escola))].sort();
            const allDisciplines = [...new Set(jsonData.professores.map(p => p.disciplina))].sort();

            allSchools.forEach(school => {
                const option = document.createElement('option');
                option.value = school;
                option.textContent = school;
                schoolFilter.appendChild(option);
            });

            allDisciplines.forEach(discipline => {
                const option = document.createElement('option');
                option.value = discipline;
                option.textContent = discipline;
                disciplineFilter.appendChild(option);
            });
        }

        // Função para alterar a ordenação
        window.setSort = (key) => {
            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = 'asc';
            }
            renderTable();
        };

        // Função debounce para otimizar a busca e filtros
        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => { currentPage = 1; func.apply(context, args); }, delay);
            };
        }
        const debouncedRenderTable = debounce(renderTable, 300);

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / rowsPerPage);
            paginationDiv.innerHTML = '';

            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Anterior';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderTable(); };
            paginationDiv.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                if (i === currentPage) btn.classList.add('active');
                btn.onclick = () => { currentPage = i; renderTable(); };
                paginationDiv.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Próximo';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderTable(); };
            paginationDiv.appendChild(nextBtn);
        }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedSchool = schoolFilter.value;
            const selectedDisciplina = disciplineFilter.value;

            const filteredProfessores = jsonData.professores.filter(professor => {
                const matchesSearch = (
                    professor.nome.toLowerCase().includes(searchTerm) ||
                    professor.escola.toLowerCase().includes(searchTerm) ||
                    professor.disciplina.toLowerCase().includes(searchTerm) ||
                    professor.ano.toLowerCase().includes(searchTerm) ||
                    professor.turma.toLowerCase().includes(searchTerm) ||
                    professor.turno.toLowerCase().includes(searchTerm)
                );

                const matchesSchool = selectedSchool === '' || professor.escola === selectedSchool;
                const matchesDiscipline = selectedDisciplina === '' || professor.disciplina === selectedDisciplina;

                return matchesSearch && matchesSchool && matchesDiscipline;
            });

            resultsCountSpan.textContent = `Mostrando ${filteredProfessores.length} professor(es) encontrado(s)`;

            // Lógica de Ordenação
            filteredProfessores.sort((a, b) => {
                let valA = a[sortConfig.key];
                let valB = b[sortConfig.key];

                if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            if (filteredProfessores.length > 0) {
                // Lógica de Paginação: fatiar os resultados
                const start = (currentPage - 1) * rowsPerPage;
                const end = start + rowsPerPage;
                const paginatedItems = filteredProfessores.slice(start, end);

                if (paginatedItems.length > 0) {
                    const headers = [
                        { label: 'Nome', key: 'nome' },
                        { label: 'Escola', key: 'escola' },
                        { label: 'Disciplina', key: 'disciplina' },
                        { label: 'Ano', key: 'ano' },
                        { label: 'Turma', key: 'turma' },
                        { label: 'Turno', key: 'turno' },
                        { label: 'Telefone', key: 'telefone' }
                        // A chave de presença será adicionada dinamicamente
                    ];
                    if (presencaKey && presencaDateFormatted) {
                        headers.push({ label: `Presença (${presencaDateFormatted})`, key: presencaKey });
                    }

                    let tableHTML = '<table>';
                    tableHTML += '<thead><tr>';
                    headers.forEach(h => {
                        let icon = '<i class="fas fa-sort" style="opacity: 0.2; margin-left: 5px;"></i>';
                        if (sortConfig.key === h.key) {
                            icon = sortConfig.direction === 'asc' 
                                ? ' <i class="fas fa-sort-up" style="margin-left: 5px;"></i>' 
                                : ' <i class="fas fa-sort-down" style="margin-left: 5px;"></i>';
                        }
                        tableHTML += `<th onclick="setSort('${h.key}')">${h.label}${icon}</th>`;
                    });
                    tableHTML += '</tr></thead><tbody>';

                    paginatedItems.forEach(professor => {
                        tableHTML += '<tr>';
                        tableHTML += `<td><strong>${professor.nome}</strong></td>`;
                        tableHTML += `<td>${professor.escola}</td>`;
                        tableHTML += `<td>${professor.disciplina}</td>`;
                        tableHTML += `<td>${professor.ano}</td>`;
                        tableHTML += `<td>${professor.turma}</td>`;
                        tableHTML += `<td>${professor.turno}</td>`;
                        tableHTML += `<td>${professor.telefone}</td>`;
                        if (presencaKey && professor[presencaKey] !== undefined) {
                            const presencaClass = professor[presencaKey] ? 'badge-presente' : 'badge-ausente';
                            const presencaText = professor[presencaKey] ? 'Presente' : 'Ausente';
                            const presencaIcon = professor[presencaKey] ? 'fa-circle-check' : 'fa-circle-xmark';
                            tableHTML += `<td><span class="badge ${presencaClass}"><i class="fas ${presencaIcon}"></i> ${presencaText}</span></td>`;
                        }
                        tableHTML += '</tr>';
                    });
                    tableHTML += '</tbody></table>';
                    professoresListDiv.innerHTML = tableHTML;
                }
            } else {
                professoresListDiv.innerHTML = '<p class="no-results-message"><i class="fas fa-exclamation-circle"></i> Nenhum professor encontrado com os critérios de busca e filtro.</p>';
            }

            renderPagination(filteredProfessores.length);
        }

        const resetAndRender = () => {
            currentPage = 1;
            renderTable();
        };

        // Adicionar event listeners para os filtros
        // Usando debouncedRenderTable para otimizar a performance
        searchInput.addEventListener('input', debouncedRenderTable);
        schoolFilter.addEventListener('change', debouncedRenderTable);
        disciplineFilter.addEventListener('change', debouncedRenderTable);

        // Iniciar o carregamento
        loadData();
    </script>
</body>
</html>
