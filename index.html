<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Professores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div id="notification-area"></div>
    <div class="container">
        <div class="theme-switch-wrapper" style="display: flex; gap: 10px;">
            <button id="auth-toggle" onclick="handleAuthClick()" title="Login Administrativo"><i class="fas fa-sign-in-alt"></i> Login</button>
            <button id="theme-toggle" title="Alternar Modo Escuro/Claro" aria-label="Alternar Tema"><i class="fas fa-moon"></i></button>
        </div>
        <div class="header-section">
            <h1>Lista de Professores</h1>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <p style="color: var(--text-secondary); margin: 0;">Sistema de Gestão e Monitoramento de Frequência Acadêmica</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="exportToPDF()" title="Exportar para PDF"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button class="btn btn-secondary" onclick="copyShareLink()" title="Copiar link desta visualização"><i class="fas fa-share-nodes"></i> Compartilhar Vista</button>
                    <button class="btn btn-primary admin-only" onclick="openProfessorModal()"><i class="fas fa-plus"></i> Novo Professor</button>
                </div>
            </div>
        </div>

        <div class="filters">
            <div>
                <label for="search-input">Pesquisa Geral</label>
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" placeholder="Nome, escola, disciplina...">
                </div>
            </div>
            <div>
                <label for="school-filter">Escola</label>
                <div style="display: flex; gap: 8px;">
                    <select id="school-filter">
                        <option value="">Todas as Escolas</option>
                    </select>
                    <button class="btn-clear admin-only" onclick="manageMetadata('escolas')" title="Adicionar Escola"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div>
                <label for="discipline-filter">Disciplina</label>
                <div style="display: flex; gap: 8px;">
                    <select id="discipline-filter">
                        <option value="">Todas as Disciplinas</option>
                    </select>
                    <button class="btn-clear admin-only" onclick="manageMetadata('disciplinas')" title="Adicionar Disciplina"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div style="flex: 0; min-width: auto;">
                <label>&nbsp;</label>
                <button class="btn-clear" id="btn-clear-filters" title="Limpar todos os filtros"><i class="fas fa-filter-circle-xmark"></i></button>
            </div>
        </div>
        <div class="results-info">
            <span id="results-count">Carregando dados...</span>
            <span>Ano Letivo: 2026</span>
        </div>
        <div id="professores-list" class="table-responsive">
            <!-- A lista de professores será carregada aqui pelo JavaScript -->
        </div>
        <div id="pagination" class="pagination"></div>

        <!-- Rodapé de Informações de Atualização (Git) -->
        <footer class="app-footer">
            <div class="footer-info">
                <span><i class="fas fa-clock-rotate-left"></i> Última Atualização: <strong>01/08/2026 às 18:41</strong></span>
                <span class="footer-separator">•</span>
                <span><i class="fas fa-code-commit"></i> Commit: <code>214d693</code></span>
                <span class="footer-separator">•</span>
                <span class="footer-changes" title="Última alteração no Git"><i class="fab fa-git-alt"></i> Modificação: <em>ssssssssss</em></span>
            </div>
        </footer>
    </div>

    <!-- Modal Professor -->
    <div id="professorModal" class="modal">
        <div class="modal-content">
            <div id="modalSuccessOverlay" class="modal-success-overlay">
                <i class="fas fa-check-circle"></i>
                <h3 id="modalSuccessMessage">Sucesso!</h3>
            </div>
            <div class="modal-header">
                <h2 id="modalTitle">Novo Professor</h2>
                <span style="cursor:pointer" onclick="closeProfessorModal()">&times;</span>
            </div>
            <form id="professorForm">
                <input type="hidden" id="prof-id">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="prof-nome" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Escola</label>
                        <select id="prof-escola" required></select>
                    </div>
                    <div class="form-group">
                        <label>Disciplina</label>
                        <select id="prof-disciplina" required></select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Ano</label>
                        <input type="text" id="prof-ano">
                    </div>
                    <div class="form-group">
                        <label>Turma</label>
                        <input type="text" id="prof-turma">
                    </div>
                    <div class="form-group">
                        <label>Turno</label>
                        <select id="prof-turno">
                            <option value="MANHÃ">MANHÃ</option>
                            <option value="TARDE">TARDE</option>
                            <option value="INTEGRAL">INTEGRAL</option>
                            <option value="NOITE">NOITE</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="prof-telefone" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label>Link da Chamada Online (Meet/Zoom/Teams)</label>
                    <input type="url" id="prof-link-chamada" placeholder="https://meet.google.com/..." style="text-transform: none;">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeProfessorModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Acesso Administrativo</h2>
                <span style="cursor:pointer" onclick="closeLoginModal()">&times;</span>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeLoginModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
                <div class="social-login">
                    <p style="text-align: center; font-size: 0.8em; color: var(--text-secondary);">Ou entre com</p>
                    <button type="button" class="btn btn-social" onclick="loginSocial('google')"><i class="fab fa-google" style="color: #ea4335;"></i> Google</button>
                    <button type="button" class="btn btn-social" onclick="loginSocial('github')"><i class="fab fa-github"></i> GitHub</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmação Customizado -->
    <div id="confirmModal" class="modal">
        <div class="modal-content confirm-modal-content">
            <i class="fas fa-exclamation-triangle confirm-icon" id="confirmIcon"></i>
            <h3 id="confirmTitle" style="margin-bottom: 10px;">Confirmação</h3>
            <p id="confirmMessage" style="color: var(--text-secondary); margin-bottom: 20px;"></p>
            <div class="form-actions" style="justify-content: center; gap: 15px;">
                <button type="button" class="btn btn-secondary" id="confirmCancelBtn">Cancelar</button>
                <button type="button" class="btn btn-danger" id="confirmOkBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Lógica Principal -->
    <script type="module" src="script.js"></script>
</body>
</html>
