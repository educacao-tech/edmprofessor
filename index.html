<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Professores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --border-color: #dfe6e9;
            --success-color: #27ae60;
            --danger-color: #d63031;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --zebra-bg: rgba(0, 0, 0, 0.035);
        }

        html[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #3791f9;
            --primary-hover: #56a2f9;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            --zebra-bg: rgba(255, 255, 255, 0.035);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        
        h1 {
            color: var(--text-color);
            text-align: left;
            margin-bottom: 0px; /* Reduzido para economizar espaço */
            font-weight: 700;
            font-size: 1.875rem;
            letter-spacing: -0.025em;
        }

        .header-section {
            margin-bottom: 1.5rem; /* Reduzido para economizar espaço */
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem; /* Reduzido para economizar espaço */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            min-height: 500px; /* Garante que o container não encolha muito */
            position: relative;
        }

        .theme-switch-wrapper {
            position: absolute;
            top: 30px;
            right: 30px;
        }

        #auth-toggle,
        #theme-toggle {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
            z-index: 20;
        }

        #auth-toggle:hover,
        #theme-toggle:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background-color: #f9fafb; /* Usar uma cor fixa para o fundo do filtro para contraste */
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        html[data-theme="dark"] .filters {
            background-color: #2a2a2a; /* Cor para o filtro no modo escuro */
        }

        .filters label {
            font-weight: 600;
            font-size: 0.9em;
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .filters > div {
            flex: 1;
            min-width: 220px;
        }

        .btn-clear {
            background: none;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .filters input[type="text"],
        .filters select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            text-transform: uppercase;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filters input[type="text"]:focus,
        .filters select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        #results-count {
            font-weight: 600;
            color: var(--primary-color);
        }

        .table-responsive {
            max-height: 650px; /* Altura máxima para a tabela com scroll */
            overflow-x: auto;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative; /* Necessário para o sticky header */
        }

        table {
            width: 100%;
            border-collapse: separate; /* Necessário para sticky header */
            border-spacing: 0;
            background-color: var(--card-bg);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            transition: box-shadow 0.2s ease;
        }

        td:hover {
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.06);
        }

        html[data-theme="dark"] td:hover {
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.04);
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600; /* Aumentado para mais destaque */
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        th:hover {
            background-color: var(--primary-hover);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 500; /* Um pouco mais leve */
            /* text-transform: uppercase; Removido, pois o texto já é maiúsculo */
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: transform 0.1s ease-in-out, filter 0.2s;
        }

        body.is-admin .badge {
            cursor: pointer;
        }

        body.is-admin .badge:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        body.is-admin .badge:active {
            transform: scale(0.95);
        }

        .badge-presente {
            background-color: var(--success-color);
        }

        .badge-ausente {
            background-color: var(--danger-color);
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #f1f3f5;
            border-color: var(--primary-color);
        }

        /* Authentication Protection */
        .admin-only {
            display: none !important;
        }
        body.is-admin .admin-only {
            display: inline-block !important;
        }
        body.is-admin th.admin-only, body.is-admin td.admin-only {
            display: table-cell !important;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: relative;
            background-color: var(--card-bg);
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: var(--shadow);
        }

        .modal-success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--card-bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: 12px;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-success-overlay i {
            font-size: 4rem;
            color: var(--success-color);
            margin-bottom: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: 0.2s;
        }

        .btn i { margin-right: 8px; }
        .btn-loading { pointer-events: none; opacity: 0.7; }
        
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1); }

        .form-group input {
            text-transform: uppercase;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-secondary { background: var(--border-color); color: var(--text-color); }
        .btn-danger { background: var(--danger-color); color: white; }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .btn-social:hover { background-color: var(--bg-color); }
        
        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .action-btn:hover { color: var(--primary-color); }
        .action-btn.delete:hover { color: var(--danger-color); }

        /* Dropdown de Ações */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: var(--card-bg);
            min-width: 140px;
            box-shadow: var(--shadow);
            z-index: 100;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .dropdown-content button {
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            border: none;
            background: none;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }
        .dropdown-content button:hover { background-color: var(--zebra-bg); color: var(--primary-color); }
        .dropdown-content button.delete:hover { color: var(--danger-color); }
        .show { display: block !important; }

        .pagination button.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Sistema de Notificações (Toasts) */
        #notification-area {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .notification {
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
            min-width: 280px;
            pointer-events: auto;
        }

        .notification.success { background-color: var(--success-color); }
        .notification.danger { background-color: var(--danger-color); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div id="notification-area"></div>
    <div class="container">
        <div class="theme-switch-wrapper" style="display: flex; gap: 10px;">
            <button id="auth-toggle" onclick="handleAuthClick()" title="Login Administrativo"><i class="fas fa-sign-in-alt"></i> Login</button>
            <button id="theme-toggle" title="Alternar Modo Escuro/Claro" aria-label="Alternar Tema"><i class="fas fa-moon"></i></button>
        </div>
        <div class="header-section">
            <h1>Lista de Professores</h1>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <p style="color: var(--text-secondary); margin: 0;">Sistema de Gestão e Monitoramento de Frequência Acadêmica</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="exportToPDF()" title="Exportar para PDF"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button class="btn btn-secondary" onclick="copyShareLink()" title="Copiar link desta visualização"><i class="fas fa-share-nodes"></i> Compartilhar Vista</button>
                    <button class="btn btn-primary admin-only" onclick="openProfessorModal()"><i class="fas fa-plus"></i> Novo Professor</button>
                </div>
            </div>
        </div>

        <div class="filters">
            <div>
                <label for="search-input">Pesquisa Geral</label>
                <input type="text" id="search-input" placeholder="Nome, escola, disciplina...">
            </div>
            <div>
                <label for="school-filter">Escola</label>
                <div style="display: flex; gap: 8px;">
                    <select id="school-filter">
                        <option value="">Todas as Escolas</option>
                    </select>
                    <button class="btn-clear admin-only" onclick="manageMetadata('escolas')" title="Adicionar Escola"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div>
                <label for="discipline-filter">Disciplina</label>
                <div style="display: flex; gap: 8px;">
                    <select id="discipline-filter">
                        <option value="">Todas as Disciplinas</option>
                    </select>
                    <button class="btn-clear admin-only" onclick="manageMetadata('disciplinas')" title="Adicionar Disciplina"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div style="flex: 0; min-width: auto;">
                <label>&nbsp;</label>
                <button class="btn-clear" id="btn-clear-filters" title="Limpar todos os filtros"><i class="fas fa-filter-circle-xmark"></i></button>
            </div>
        </div>
        <div class="results-info">
            <span id="results-count">Carregando dados...</span>
            <span>Ano Letivo: 2026</span>
        </div>
        <div id="professores-list" class="table-responsive">
            <!-- A lista de professores será carregada aqui pelo JavaScript -->
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <!-- Modal Professor -->
    <div id="professorModal" class="modal">
        <div class="modal-content">
            <div id="modalSuccessOverlay" class="modal-success-overlay">
                <i class="fas fa-check-circle"></i>
                <h3 id="modalSuccessMessage">Sucesso!</h3>
            </div>
            <div class="modal-header">
                <h2 id="modalTitle">Novo Professor</h2>
                <span style="cursor:pointer" onclick="closeProfessorModal()">&times;</span>
            </div>
            <form id="professorForm">
                <input type="hidden" id="prof-id">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="prof-nome" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Escola</label>
                        <select id="prof-escola" required></select>
                    </div>
                    <div class="form-group">
                        <label>Disciplina</label>
                        <select id="prof-disciplina" required></select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Ano</label>
                        <input type="text" id="prof-ano">
                    </div>
                    <div class="form-group">
                        <label>Turma</label>
                        <input type="text" id="prof-turma">
                    </div>
                    <div class="form-group">
                        <label>Turno</label>
                        <select id="prof-turno">
                            <option value="MANHÃ">MANHÃ</option>
                            <option value="TARDE">TARDE</option>
                            <option value="INTEGRAL">INTEGRAL</option>
                            <option value="NOITE">NOITE</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="prof-telefone" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label>Link da Chamada Online (Meet/Zoom/Teams)</label>
                    <input type="url" id="prof-link-chamada" placeholder="https://meet.google.com/..." style="text-transform: none;">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeProfessorModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Acesso Administrativo</h2>
                <span style="cursor:pointer" onclick="closeLoginModal()">&times;</span>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeLoginModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
                <div class="social-login">
                    <p style="text-align: center; font-size: 0.8em; color: var(--text-secondary);">Ou entre com</p>
                    <button type="button" class="btn btn-social" onclick="loginSocial('google')"><i class="fab fa-google" style="color: #ea4335;"></i> Google</button>
                    <button type="button" class="btn btn-social" onclick="loginSocial('github')"><i class="fab fa-github"></i> GitHub</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc, addDoc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, GithubAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";

        // Cole aqui as configurações do seu projeto Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSyCwWtrJSuwx_wwXRIie2KVq-5USYTQBM2g",
            authDomain: "edmprofessor-1542b.firebaseapp.com",
            projectId: "edmprofessor-1542b",
            storageBucket: "edmprofessor-1542b.firebasestorage.app",
            messagingSenderId: "225511245642",
            appId: "1:225511245642:web:c021e0760fde3d51f6e3b3",
            measurementId: "G-MT07NMRYXJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        try {
            const analytics = getAnalytics(app);
        } catch (e) {
            console.warn("Firebase Analytics não pôde ser carregado (possível bloqueador de anúncios).");
        }

        // Helper para evitar XSS (Cross-Site Scripting)
        function escapeHTML(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Função para exibir notificações amigáveis na tela
        window.showNotification = (message, type = 'success') => {
            const area = document.getElementById('notification-area');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
            notification.innerHTML = `<i class="fas ${icon}"></i> <span>${escapeHTML(message)}</span>`;
            area.appendChild(notification);
            setTimeout(() => {
                notification.style.animation = 'fadeOut 0.5s forwards';
                setTimeout(() => notification.remove(), 500);
            }, 3500);
        };

        // Máscara para Telefone (00) 00000-0000
        const applyPhoneMask = (value) => {
            if (!value) return "";
            return value.replace(/\D/g, '').replace(/(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d)/, "$1-$2").replace(/(-\d{4})\d+?$/, "$1");
        };

        // Lógica de Dark Mode
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            updateThemeIcon('dark');
        } else {
            updateThemeIcon('light'); // Garante que o ícone inicial esteja correto para o tema claro
        }

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // Lógica de Autenticação
        const loginModal = document.getElementById('loginModal');
        const loginForm = document.getElementById('loginForm');

        window.handleAuthClick = () => {
            console.log("Status Auth:", auth.currentUser ? "Logado" : "Deslogado");
            if (auth.currentUser) {
                if(confirm("Deseja encerrar a sessão administrativa?")) signOut(auth);
            } else {

            if (!professores || professores.length === 0) return;
            
            // Tenta encontrar a chave de presença mais recente disponível nos dados
            const foundKey = professores.reduce((acc, prof) => {
                if (acc) return acc;

            }, null);

            // 1. Ouvinte em tempo real para Professores
            onSnapshot(collection(db, "professores"), (snapshot) => {
                if (snapshot.empty) {
                    professoresListDiv.innerHTML = '<p class="no-results-message"><i class="fas fa-database"></i> O banco de dados está vazio. Execute o script de migração.</p>';
                    jsonData.professores = []; //
                    renderTable(); //
                    return;
                }

                jsonData.professores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Atualizar metadados de presença baseado nos dados novos
                extractPresenceInfo(jsonData.professores); //
                
                // Re-inicializar filtros apenas se estiverem vazios
                // if (schoolFilter.options.length <= 1) initFilters(); // - Removido, initFilters será chamado pelo onSnapshot de configurações
                
                renderTable(); //

                window.showNotification(`Erro de Permissão ou Conexão: ${error.message}`, 'danger'); //
                professoresListDiv.innerHTML = `<p class="no-results-message"><i class="fas fa-shield-alt"></i> Erro de Permissão: Verifique as Regras do Firestore.<br><small>${escapeHTML(error.message)}</small></p>`; //
            });

            // 2. Ouvinte em tempo real para Configurações (se desejar atualizações em tempo real)
            onSnapshot(doc(db, "configuracoes", "geral"), (configSnap) => { //
                if (configSnap.exists()) {
                    const configData = configSnap.data();
                    jsonData.escolas = configData.escolas;

                    initFilters(); // Re-inicializa os filtros quando as configurações mudam

                } else { //
                    jsonData.escolas = []; //
                    jsonData.disciplinas = []; //
                    initFilters(); //
                    renderTable(); //

        const professoresListDiv = document.getElementById('professores-list');
        const searchInput = document.getElementById('search-input');
        const schoolFilter = document.getElementById('school-filter');
        const disciplineFilter = document.getElementById('discipline-filter');
        const paginationDiv = document.getElementById('pagination');
        const btnClearFilters = document.getElementById('btn-clear-filters');
        const resultsCountSpan = document.getElementById('results-count');

        // Configuração de ordenação inicial
        let sortConfig = {
            key: 'nome',
            direction: 'asc'
        };

        // Configuração de paginação
        let currentPage = 1;
        const rowsPerPage = 10;

        function initFilters() {
            // Salva os valores selecionados atualmente para não perdê-los no refresh real-time
            const currentSchool = schoolFilter.value;
            const currentDiscipline = disciplineFilter.value;

            // Limpa as opções atuais para evitar duplicatas
            schoolFilter.innerHTML = '<option value="">Todas as Escolas</option>';
            disciplineFilter.innerHTML = '<option value="">Todas as Disciplinas</option>';

            // Prioriza as listas de metadados do Firebase, caso existam
            const schools = (jsonData.escolas && jsonData.escolas.length > 0) 
                ? jsonData.escolas 
                : [...new Set(jsonData.professores.map(p => p.escola))].sort();
                
            const disciplines = (jsonData.disciplinas && jsonData.disciplinas.length > 0)
                ? jsonData.disciplinas
                : [...new Set(jsonData.professores.map(p => p.disciplina))].sort();

            schools.forEach(school => {
                schoolFilter.add(new Option(school, school));
            });
            schoolFilter.value = currentSchool;

            disciplines.forEach(discipline => {
                disciplineFilter.add(new Option(discipline, discipline));
            });
            disciplineFilter.value = currentDiscipline;
        }

        // Função para alterar a ordenação
        window.setSort = (key) => {
            if (key === 'actions') return; // Não ordenar pela coluna de ações
            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = 'asc';
            }
            renderTable();
        };

        // Função debounce para otimizar a busca e filtros
        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => { currentPage = 1; func.apply(context, args); }, delay);
            };
        }
        const debouncedRenderTable = debounce(renderTable, 300);

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / rowsPerPage);
            paginationDiv.innerHTML = '';

            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Anterior';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderTable(); };
            paginationDiv.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                if (i === currentPage) btn.classList.add('active');
                btn.onclick = () => { currentPage = i; renderTable(); };
                paginationDiv.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Próximo';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderTable(); };
            paginationDiv.appendChild(nextBtn);
        }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedSchool = schoolFilter.value;
            const selectedDisciplina = disciplineFilter.value;

            const filteredProfessores = jsonData.professores.filter(professor => {
                const safeVal = (val) => (val || "").toString().toLowerCase();
                
                const matchesSearch = (
                    safeVal(professor.nome).includes(searchTerm) ||
                    safeVal(professor.escola).includes(searchTerm) ||
                    safeVal(professor.disciplina).includes(searchTerm) ||
                    safeVal(professor.ano).includes(searchTerm) ||
                    safeVal(professor.turma).includes(searchTerm) ||
                    safeVal(professor.turno).includes(searchTerm)
                );

                const matchesSchool = selectedSchool === '' || professor.escola === selectedSchool;
                const matchesDiscipline = selectedDisciplina === '' || professor.disciplina === selectedDisciplina;

                return matchesSearch && matchesSchool && matchesDiscipline;
            });

            resultsCountSpan.textContent = `Mostrando ${filteredProfessores.length} professor(es) encontrado(s)`;

            // Lógica de Ordenação
            filteredProfessores.sort((a, b) => {
                let valA = a[sortConfig.key];
                let valB = b[sortConfig.key];

                if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            if (filteredProfessores.length > 0) {
                // Lógica de Paginação: fatiar os resultados
                const start = (currentPage - 1) * rowsPerPage;
                const end = start + rowsPerPage;
                const paginatedItems = filteredProfessores.slice(start, end);

                if (paginatedItems.length > 0) {
                    const headers = [
                        { label: 'Nome', key: 'nome' },
                        { label: 'Escola', key: 'escola' },
                        { label: 'Disciplina', key: 'disciplina' },
                        { label: 'Ano', key: 'ano' },
                        { label: 'Turma', key: 'turma' },
                        { label: 'Turno', key: 'turno' },
                        { label: 'Telefone', key: 'telefone' },
                        { label: 'Link', key: 'link_chamada' }
                        // A chave de presença será adicionada dinamicamente
                    ];
                    if (presencaKey && presencaDateFormatted) {
                        headers.push({ label: `Presença (${presencaDateFormatted})`, key: presencaKey });
                    }
                    headers.push({ label: 'Ações', key: 'actions' });

                    let tableHTML = '<table>';
                    tableHTML += '<thead><tr>';
                    headers.forEach(h => {
                        let icon = (h.key !== 'actions') ? '<i class="fas fa-sort" style="opacity: 0.2; margin-left: 5px;"></i>' : '';
                        if (sortConfig.key === h.key) {
                            icon = sortConfig.direction === 'asc' 
                                ? ' <i class="fas fa-sort-up" style="margin-left: 5px;"></i>' 
                                : ' <i class="fas fa-sort-down" style="margin-left: 5px;"></i>';
                        }
                        let adminClass = h.key === 'actions' ? 'admin-only' : '';
                        let style = h.key === 'actions' ? 'style="cursor: default;"' : '';
                        tableHTML += `<th onclick="setSort('${h.key}')" class="${adminClass}" ${style}>${h.label}${icon}</th>`;
                    });
                    tableHTML += '</tr></thead><tbody>';

                    paginatedItems.forEach(professor => {
                        tableHTML += '<tr>';
                        tableHTML += `<td><strong>${escapeHTML(professor.nome)}</strong></td>`;
                        tableHTML += `<td>${escapeHTML(professor.escola)}</td>`;
                        tableHTML += `<td>${escapeHTML(professor.disciplina)}</td>`;
                        tableHTML += `<td>${escapeHTML(professor.ano)}</td>`;
                        tableHTML += `<td>${escapeHTML(professor.turma)}</td>`;
                        tableHTML += `<td>${escapeHTML(professor.turno)}</td>`;
                        tableHTML += `<td>${escapeHTML(professor.telefone)}</td>`;
                        
                        const linkHtml = professor.link_chamada 
                            ? `<a href="${escapeHTML(professor.link_chamada)}" target="_blank" class="link-call" title="Abrir Chamada Online"><i class="fas fa-video"></i></a>` 
                            : '<span style="color: #ccc; font-size: 0.8em;">N/A</span>';
                        tableHTML += `<td style="text-align: center;">${linkHtml}</td>`;

                        if (presencaKey && professor[presencaKey] !== undefined) {
                            const isPresent = professor[presencaKey];
                            const presencaClass = isPresent ? 'badge-presente' : 'badge-ausente';
                            const presencaText = isPresent ? 'Presente' : 'Ausente';
                            const presencaIcon = isPresent ? 'fa-circle-check' : 'fa-circle-xmark';
                            
                            const clickHandler = auth.currentUser ? `onclick="togglePresenca('${professor.id}', ${isPresent})"` : '';
                            const tooltip = auth.currentUser ? 'title="Clique para alternar presença"' : '';
                            
                            tableHTML += `<td><span class="badge ${presencaClass}" ${clickHandler} ${tooltip}><i class="fas ${presencaIcon}"></i> ${escapeHTML(presencaText)}</span></td>`;
                        }
                        tableHTML += `<td class="admin-only">
                            <div class="action-btns">
                                <button class="action-btn" onclick="openProfessorModal('${professor.id}')" title="Editar"><i class="fas fa-edit"></i></button>
                                <button class="action-btn delete" onclick="deleteProfessor('${professor.id}', '${escapeHTML(professor.nome)}')" title="Excluir"><i class="fas fa-trash"></i></button>
                            <div class="dropdown">
                                <button class="action-btn" onclick="toggleActions('${professor.id}', event)" title="Ações">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <div id="dropdown-${professor.id}" class="dropdown-content">
                                    <button onclick="openProfessorModal('${professor.id}')"><i class="fas fa-edit"></i> Editar</button>
                                    <button class="delete" onclick="deleteProfessor('${professor.id}', '${escapeHTML(professor.nome)}')"><i class="fas fa-trash"></i> Excluir</button>
                                </div>
                            </div>
                        </td>`;
                        tableHTML += '</tr>';
                    });
                    tableHTML += '</tbody></table>';
                    professoresListDiv.innerHTML = tableHTML;
                }
            } else {
                professoresListDiv.innerHTML = '<p class="no-results-message"><i class="fas fa-exclamation-circle"></i> Nenhum professor encontrado com os critérios de busca e filtro.</p>';
            }

            renderPagination(filteredProfessores.length);
        }

        btnClearFilters.addEventListener('click', () => {
            searchInput.value = '';
            schoolFilter.value = '';
            disciplineFilter.value = '';
            resetAndRender();
        });

        const resetAndRender = () => {
            currentPage = 1;
            renderTable();
        };

        // Adicionar event listeners para os filtros
        // Usando debouncedRenderTable para otimizar a performance
        searchInput.addEventListener('input', debouncedRenderTable);

        // Forçar maiúsculas nos campos de texto (UI e Valor)
        const uppercaseFields = ['search-input', 'prof-nome', 'prof-ano', 'prof-turma'];
        uppercaseFields.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase(); });
            }
        });

        schoolFilter.addEventListener('change', debouncedRenderTable);
        disciplineFilter.addEventListener('change', debouncedRenderTable);

        // Verificar parâmetros da URL ao carregar para auto-filtrar
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('search')) searchInput.value = params.get('search').toUpperCase();
            if (params.has('escola')) schoolFilter.value = params.get('escola').toUpperCase();
            if (params.has('disciplina')) disciplineFilter.value = params.get('disciplina').toUpperCase();
            if (params.toString()) debouncedRenderTable();
        });

        // Iniciar o carregamento
        loadData();
    </script>
</body>
</html>
